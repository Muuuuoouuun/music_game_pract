<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0820" />
  <title>KeyStage</title>
  <meta name="description" content="실제 피아노·MIDI 건반으로 악보와 떨어지는 노트를 보며 연주하는 리듬게임" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700;800&family=Noto+Music&family=Orbit&display=swap" />
  <link rel="stylesheet" href="/src/styles/editor.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 1 27 17H5Z' fill='%23ffcd78'/%3E%3Crect x='4' y='17' width='7.6' height='13' rx='1.4' fill='%23f5efe2'/%3E%3Crect x='12.2' y='17' width='7.6' height='13' rx='1.4' fill='%23f5efe2'/%3E%3Crect x='20.4' y='17' width='7.6' height='13' rx='1.4' fill='%23f5efe2'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="KEYSTAGE 홈">
        <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcd78"/><stop offset="1" stop-color="#ff9d5c" stop-opacity=".15"/></linearGradient></defs><path d="M16 1 27 17H5Z" fill="url(#beam)"/><rect x="4" y="17" width="7.6" height="13" rx="1.4" fill="#f5efe2"/><rect x="12.2" y="17" width="7.6" height="13" rx="1.4" fill="#f5efe2"/><rect x="20.4" y="17" width="7.6" height="13" rx="1.4" fill="#f5efe2"/><rect x="9.6" y="17" width="4.6" height="8" rx="1" fill="#151236"/><rect x="17.8" y="17" width="4.6" height="8" rx="1" fill="#151236"/></svg>
        <span>KEY<b>STAGE</b></span>
      </a>
      <nav class="tabs" role="tablist" aria-label="화면">
        <a class="tab" role="tab" id="tab-home" href="#home" aria-controls="scr-home">홈</a>
        <a class="tab" role="tab" id="tab-import" href="#import" aria-controls="scr-import">새 곡</a>
        <a class="tab" role="tab" id="tab-play" href="#play" aria-controls="scr-play">플레이</a>
        <a class="tab" role="tab" id="tab-result" href="#result" aria-controls="scr-result">결과</a>
        <a class="tab" role="tab" id="tab-device" href="#device" aria-controls="scr-device"><i class="tab-dot" aria-hidden="true"></i>건반 연결</a>
      </nav>
      <a class="chip dev" id="devChip" href="#device" title="건반 연결 상태 보기"><i></i><span>PC 키보드로 플레이 중</span></a>
    </header>
    <main>
      <section class="screen" id="scr-home" role="tabpanel" aria-labelledby="tab-home" hidden></section>
      <section class="screen" id="scr-import" role="tabpanel" aria-labelledby="tab-import" hidden></section>
      <section class="screen" id="scr-play" role="tabpanel" aria-labelledby="tab-play" hidden></section>
      <section class="screen" id="scr-result" role="tabpanel" aria-labelledby="tab-result" hidden></section>
      <section class="screen" id="scr-device" role="tabpanel" aria-labelledby="tab-device" hidden></section>
      <section class="screen" id="scr-edit" aria-label="악보 편집" hidden></section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="tip" id="tip" hidden></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
